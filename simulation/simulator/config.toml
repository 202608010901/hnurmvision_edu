# Bevy RoboMaster Simulator Configuration

[window]
# Rendering present mode. Use `auto_no_vsync` to exceed 60Hz for Talos/ROS2 capture.
# Options: auto_vsync, auto_no_vsync, fifo, fifo_relaxed, mailbox, immediate
present_mode = "immediate"

[debug]
# Turn these on only when needed; they noticeably reduce FPS.
egui = false
inspector = false
# Prints FPS/frametime diagnostics to console.
diagnostics = false

[preview]
# On-screen preview camera. Disable to avoid rendering the scene twice (preview + capture).
enabled = true

[render]
# Expensive on large scenes; disable for higher FPS.
shadows = false
# Main on-screen camera anti-aliasing.
main_camera_fxaa = false
illuminance = 500.0

[vision]
# What a camera sees, rather than what looks right in the preview window.
# The glTF armour LEDs render far dimmer than real ones, which are blown out by the
# sensor: measured lamp grey peaks at ~142, below the 150 the team's lightbar stage
# thresholds at. That stage does not produce detections (the YOLOv5 network does) but it
# is the corner-refinement pass that runs inside every detection; at 142 it never fires.
# Scaling only the emissive term leaves geometry, hitboxes and rule timing untouched.
armor_emissive_scale = 3.0
# Real glass spreads a blown-out LED into a halo wider than the emitter itself.
bloom_intensity = 0.0
# Sensor noise in grey levels added to published frames (0 = pristine render).
noise_sigma = 2.0

[power_rune]
# Both red and blue faces use the same match phase. "large" starts a rules-compliant big rune.
mode = "large"
# Automatically enter the 20 s activation window after startup/reset.
auto_activate_delay_secs = 1.0
# Accept /vision_send_data immediately; F5 can still toggle it at runtime.
auto_aim_enabled = true
# Put the controlled robot on the red-side viewing axis instead of inside the rune model.
vision_test_pose = true
# The glTF active-rune LEDs are much darker than real camera footage after off-screen capture.
# Scale only their emissive term; geometry, hitboxes and rule timing remain unchanged.
vision_emissive_scale = 2.5

[capture.color]
# RGB capture resolution for existing camera pipeline.
width = 1440
height = 1080

[capture.depth]
# Depth capture resolution for livox-compatible point cloud output.
width = 1280
height = 720
near = 0.1
far = 80.0

[livox_ros]
enabled = false
frame_id = "camera_link"
publish_freq = 10.0
points_per_second = 400000
line_num = 20
tag_default = 0
intensity_default = 1000.0

[physics]
fixed_hz = 120.0                # power-rune closed-loop test rate
substep_count = 8               # 120 Hz x 8 = 960 Hz: 17 mm ball must not skip a 45 mm plate

[vehicle]
rotation_speed = 7.42            # rad/s - chassis rotation speed
gimbal_rotation_speed = 2.5     # rad/s - fast reposition; vision command filter suppresses jitter
gimbal_command_deadband_deg = 0.05 # ignore command changes within this angle (degree)
gimbal_pitch_limit = 0.785      # rad - gimbal pitch limit (~45 degrees)
max_speed = 6.0                 # m/s - maximum vehicle speed
linear_acceleration = 6.0       # m/s^2 - linear acceleration
acceleration_exponent = 2.5    # exponent for non-linear acceleration curve

[mecanum]
wheel_radius_m = 0.076          # wheel radius (m)
half_wheelbase_m = 0.18         # half of front-rear wheel spacing (m)
half_trackwidth_m = 0.15        # half of left-right wheel spacing (m)

[projectile]
lifetime = 5.0                  # seconds - projectile lifetime
speed = 25.0                    # m/s - initial speed
cooldown = 0.05                  # seconds - fire cooldown
diameter = 0.017                # meters - projectile diameter (17mm)
mass = 0.0032                    # kg - projectile mass (17g)
friction = 1.1                  # friction coefficient
linear_damping = 0.0            # linear damping (set to 0 for physics-based drag below)
uav_vel = 5.0
uav_size = 0.5
[projectile.aerodynamics]
enabled = false                  # enable aerodynamic forces
air_density = 1.225             # kg/m^3 - air density at sea level
drag_coefficient = 0.22516         # Cd - smooth sphere drag coefficient
wind = [0.0, 0.0, 0.0]          # m/s - wind velocity in world coordinates

[camera]
fov = 45.0                      # degrees - field of view
free_move_speed = 8.0           # m/s - free camera movement speed
follow_offset = [0.0, 3.0, 2.0] # follow camera offset
mouse_sensitivity = 0.003       # mouse look sensitivity

[training]
hit_detection = "swept" # swept (authoritative), shadow (independent comparison), legacy
hit_debug = false # draw actual armor meshes, blocking bounds, sweeps and impact normals
damage_per_hit = 10.0 # 教学计分值，不代表完整裁判系统规则；重启生效
enabled = true
observer = [-11.0, 0.01, 0.0]
# 观察位到靶车 3 m（原来 6 m）。这个距离是由队伍自瞄的检测能力反推的，不是美术偏好：
# YOLOv5 的 score_threshold 固定 0.7，仿真渲染的装甲在 6 m 处只有 ~30 px，网络几乎不响应
# （连续 2921 帧 armor_num=0）；4.5 m 仍有 99.9% 丢检，4 m 恢复 100% 检出但跟踪会 temp_lost，
# 3 m 起连续 50 s 稳定锁死。原因见 docs 里对焦距的讨论——仿真 fx=1303.7，实车 ~1850。
targets_x = -8.0
targets_y = 0.0
lane_spacing = 2.0
# 只保留当前选中的靶车：另外两台被停放到场上空（视野外、弹道外）。
# 三台车同时进画面是教室布局，真实比赛里自瞄一次只会面对一个敌人。
solo_target = true
translation_amplitude = 0.5
translation_period = 4.0
rotation_speed = 2.0
